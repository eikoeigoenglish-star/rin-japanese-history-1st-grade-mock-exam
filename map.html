<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101014">
  <title>京都検定2級 出題地図</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=4.1.0">
  <link rel="stylesheet" href="map.css?v=1.3.0">
</head>

<body class="map-body">
<div class="app map-app">

  <header class="app-header map-header">
    <p class="app-eyebrow">KYOTO KENTEI — GRADE 2</p>
    <h1 class="app-title">出題地図<span class="app-title-sub">過去問11回分に登場した場所</span></h1>
    <p class="app-lead">よく問われる場所ほど強く光ります。球を押すと、その場所が出た問題が開きます。</p>
    <p class="map-nav"><a href="index.html">← 四択トレーニングに戻る</a></p>
  </header>

  <section class="panel map-controls" aria-label="表示の絞り込み">
    <div class="chip-group">
      <input type="checkbox" id="show-rare" name="show-rare">
      <label class="chip chip-wide" for="show-rare">1回だけの場所も出す</label>

      <input type="checkbox" id="show-weak" name="show-weak">
      <label class="chip chip-wide" for="show-weak">未習得を含む場所だけ</label>
    </div>
    <p id="map-status" class="panel-note map-status" aria-live="polite">読み込み中…</p>
  </section>

  <div id="map" class="map-canvas" role="application" aria-label="京都の出題地点地図"></div>

  <p class="map-note">
    球の大きさと光の強さは登場回数に比例します。位置はWikipediaの座標にもとづく目安です。
  </p>

  <footer class="app-footer">
    <p>京都検定2級 四択トレーニング</p>
  </footer>

  <aside id="sheet" class="sheet" role="dialog" aria-label="地点の詳細" hidden>
    <div id="sheet-handle" class="sheet-handle">
      <span class="sheet-grip" aria-hidden="true"></span>
    </div>
    <button type="button" id="sheet-close" class="sheet-close" aria-label="閉じる">×</button>
    <div id="sheet-body" class="sheet-body"></div>
  </aside>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js?v=1.3.0"></script>
</body>
</html>
